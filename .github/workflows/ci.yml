name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    name: Formatting (Swift 6)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Formatting (lint)
        run: swift format lint --strict -r Sources Tests

  macos:
    name: macOS (Build & Test)
    runs-on: macos-15
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build -c debug
      - name: Test (debug, isolated)
        env:
          PTR_SKIP_STUN: "1"
          SKIP_NETWORK_TESTS: "1"
        run: swift test -c debug
      - name: Build (release)
        run: swift build -c release
      - name: Build external-package integration
        run: swift build --package-path IntegrationPackage
      - name: Build external API compatibility consumer
        run: swift build --package-path TestLibraryUsage

  api:
    name: API compatibility (against v0.18.1)
    runs-on: macos-15
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The baseline is a tag: fetch all history and tags so v0.18.1 can be checked out.
          fetch-depth: 0
          fetch-tags: true
      - name: Swift version
        run: swift --version
      # Fails on any source break that api-breakage-allowlist.txt does not name, one exact
      # diagnostic per line. The breaks allowed are the ones docs/BLOCKING-IO.md names for 0.19.
      # TEMPORARY diagnostic steps (to be removed): which part of the SwiftPM invocation fails.
      - name: Variants (diagnostic)
        run: |
          set +e
          ALLOW="$PWD/api-breakage-allowlist.txt"
          variant() {
            name=$1; shift
            echo "=== $name"
            "$@" > "v-$name.log" 2>&1
            echo "exit $?"
            grep -E "breaking change|No breaking|API breakage" "v-$name.log" | head -6
            rm -rf .build/arm64-apple-macosx/apidiff
          }
          variant targets-616 swift package diagnose-api-breaking-changes v0.18.1 --targets SwiftFTR --breakage-allowlist-path "$ALLOW"
          variant products-noallow-616 swift package diagnose-api-breaking-changes v0.18.1 --products SwiftFTR
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          swift --version
          rm -rf .build
          variant products-263 swift package diagnose-api-breaking-changes v0.18.1 --products SwiftFTR --breakage-allowlist-path "$ALLOW"
          variant products-noallow-263 swift package diagnose-api-breaking-changes v0.18.1 --products SwiftFTR

  docs:
    name: Documentation (DocC)
    runs-on: macos-15
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      # Symbol links to enum cases need their full signature, and a broken one is invisible
      # until docs are built. Gated here because a release is the wrong time to find out.
      - name: Generate documentation (warnings as errors)
        run: |
          swift package --allow-writing-to-directory docc \
            generate-documentation --target SwiftFTR \
            --output-path docc --transform-for-static-hosting \
            --warnings-as-errors
