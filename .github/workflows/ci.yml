name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    name: Formatting (Swift 6)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Formatting (lint)
        run: swift format lint --strict -r Sources Tests

  macos:
    name: macOS (Build & Test)
    runs-on: macos-15
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build -c debug
      - name: Test (debug, isolated)
        env:
          PTR_SKIP_STUN: "1"
          SKIP_NETWORK_TESTS: "1"
        run: swift test -c debug
      - name: Build (release)
        run: swift build -c release
      - name: Build external-package integration
        run: swift build --package-path IntegrationPackage
      - name: Build external API compatibility consumer
        run: swift build --package-path TestLibraryUsage

  api:
    name: API compatibility (against v0.18.1)
    runs-on: macos-15
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The baseline is a tag: fetch all history and tags so v0.18.1 can be checked out.
          fetch-depth: 0
          fetch-tags: true
      - name: Swift version
        run: swift --version
      # Fails on any source break that api-breakage-allowlist.txt does not name, one exact
      # diagnostic per line. The breaks allowed are the ones docs/BLOCKING-IO.md names for 0.19.
      # TEMPORARY diagnostic steps (to be removed): find why 6.1.2 reports every API removed.
      - name: List Xcodes
        run: ls /Applications | grep -i xcode; xcode-select -p
      - name: Diagnose API breaking changes (verbose, diagnostic)
        run: |
          swift package --verbose diagnose-api-breaking-changes v0.18.1 --products SwiftFTR \
            --breakage-allowlist-path "$PWD/api-breakage-allowlist.txt" 2>&1 | tee apidiff.log \
            | grep -v "^\[" | grep -iE "digester|error|warning|cannot|failed|breaking|breakage" | head -80 || true
          echo "--- dumps"
          find .build -path '*apidiff*' -name '*.json' -exec ls -la {} \; | head
      - name: Dump the current module directly (diagnostic)
        run: |
          MODS=$(dirname $(find .build/debug/Modules .build/arm64-apple-macosx/debug/Modules -name 'SwiftFTR.swiftmodule' 2>/dev/null | head -1))
          echo "modules: $MODS"
          xcrun swift-api-digester -dump-sdk -module SwiftFTR -o current.json \
            -I "$MODS" -sdk "$(xcrun --show-sdk-path)" -target arm64-apple-macosx13.0 -v 2>&1 | tail -30 || true
          ls -la current.json || true
          grep -c '"kind": "TypeDecl"' current.json || true

  docs:
    name: Documentation (DocC)
    runs-on: macos-15
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      # Symbol links to enum cases need their full signature, and a broken one is invisible
      # until docs are built. Gated here because a release is the wrong time to find out.
      - name: Generate documentation (warnings as errors)
        run: |
          swift package --allow-writing-to-directory docc \
            generate-documentation --target SwiftFTR \
            --output-path docc --transform-for-static-hosting \
            --warnings-as-errors
