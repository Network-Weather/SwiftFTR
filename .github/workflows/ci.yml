name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    name: Formatting (Swift 6)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Formatting (lint)
        run: swift format lint --strict -r Sources Tests

  macos:
    name: macOS (Build & Test)
    runs-on: macos-15
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build -c debug
      - name: Test (debug, isolated)
        env:
          PTR_SKIP_STUN: "1"
          SKIP_NETWORK_TESTS: "1"
        run: swift test -c debug
      - name: Build (release)
        run: swift build -c release
      - name: Build external-package integration
        run: swift build --package-path IntegrationPackage
      - name: Build external API compatibility consumer
        run: swift build --package-path TestLibraryUsage

  api:
    name: API compatibility (against v0.18.1)
    runs-on: macos-15
    needs: format
    # Swift 6.1.2's `swift package diagnose-api-breaking-changes` reports every public declaration
    # of this package as removed (124 "has been removed"), with or without the allowlist and with
    # --products or --targets, although its own swift-api-digester, run directly against the same
    # baseline dump, reports exactly the two added DNSError cases. So this job, and only this job,
    # runs on a newer Xcode from the image; build and test stay on the minimum toolchain.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The baseline is a tag: fetch all history and tags so v0.18.1 can be checked out.
          fetch-depth: 0
          fetch-tags: true
      - name: Swift version
        run: swift --version
      # The check must discriminate: without the allowlist it has to report exactly the breaks the
      # allowlist names, one exact diagnostic per line, and nothing else. The breaks allowed are the
      # ones docs/BLOCKING-IO.md names for 0.19.
      - name: Without the allowlist, exactly the allowlisted breaks are reported
        run: |
          set +e
          swift package diagnose-api-breaking-changes v0.18.1 --products SwiftFTR > unlisted.log 2>&1
          status=$?
          set -e
          grep -o 'API breakage: .*' unlisted.log | sort > reported.txt
          grep -v '^[[:space:]]*$' api-breakage-allowlist.txt | sort > allowed.txt
          cat reported.txt
          if [ "$status" -eq 0 ] || ! diff -u allowed.txt reported.txt; then
            echo "::error::the API check without the allowlist did not report exactly the allowlisted breaks"
            tail -40 unlisted.log
            exit 1
          fi
      - name: Diagnose API breaking changes
        run: |
          swift package diagnose-api-breaking-changes v0.18.1 --products SwiftFTR \
            --breakage-allowlist-path "$PWD/api-breakage-allowlist.txt"

  docs:
    name: Documentation (DocC)
    runs-on: macos-15
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      # Symbol links to enum cases need their full signature, and a broken one is invisible
      # until docs are built. Gated here because a release is the wrong time to find out.
      - name: Generate documentation (warnings as errors)
        run: |
          swift package --allow-writing-to-directory docc \
            generate-documentation --target SwiftFTR \
            --output-path docc --transform-for-static-hosting \
            --warnings-as-errors
