name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    name: Formatting (Swift 6)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Formatting (lint)
        run: swift format lint --strict -r Sources Tests

  macos:
    name: macOS (Build & Test)
    runs-on: macos-15
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build -c debug
      - name: Test (debug, isolated)
        env:
          PTR_SKIP_STUN: "1"
          SKIP_NETWORK_TESTS: "1"
        run: swift test -c debug
      - name: Build (release)
        run: swift build -c release
      - name: Build external-package integration
        run: swift build --package-path IntegrationPackage
      - name: Build external API compatibility consumer
        run: swift build --package-path TestLibraryUsage

  docs:
    name: Documentation (DocC)
    runs-on: macos-15
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      # Symbol links to enum cases need their full signature, and a broken one is invisible
      # until docs are built. Gated here because a release is the wrong time to find out.
      - name: Generate documentation (warnings as errors)
        run: |
          swift package --allow-writing-to-directory docc \
            generate-documentation --target SwiftFTR \
            --output-path docc --transform-for-static-hosting \
            --warnings-as-errors
